<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1100" viewBox="0 0 1500 1100">
  <defs>
    <style>
      .bg { fill: #f5f7fb; }
      .title { font: 700 34px Arial, sans-serif; fill: #111827; }
      .subtitle { font: 400 18px Arial, sans-serif; fill: #4b5563; }
      .section { font: 700 22px Arial, sans-serif; fill: #1f2937; }
      .text { font: 600 18px Arial, sans-serif; fill: #111827; }
      .small { font: 400 15px Arial, sans-serif; fill: #374151; }
      .box { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2; rx: 10; }
      .input { fill: #e0f2fe; stroke: #0284c7; }
      .process { fill: #eef2ff; stroke: #4f46e5; }
      .decision { fill: #fff7ed; stroke: #ea580c; }
      .alert { fill: #fee2e2; stroke: #dc2626; }
      .store { fill: #ecfdf5; stroke: #059669; }
      .ui { fill: #fdf2f8; stroke: #db2777; }
      .line { stroke: #475569; stroke-width: 2.5; fill: none; marker-end: url(#arrow); }
      .dash { stroke: #64748b; stroke-width: 2.2; fill: none; stroke-dasharray: 7 7; marker-end: url(#arrow); }
      .label { font: 700 14px Arial, sans-serif; fill: #334155; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="1500" height="1100"/>
  <text class="title" x="60" y="60">PPE No-Helmet Detection - System Flowchart</text>
  <text class="subtitle" x="60" y="92">Luồng thực tế trong dự án PyQt: Camera/Upload -> YOLO -> ROI + Violation Engine -> Cảnh báo -> Lưu lịch sử</text>

  <text class="section" x="80" y="150">Sơ đồ hệ thống</text>
  <rect class="box input" x="80" y="175" width="220" height="90"/>
  <text class="text" x="125" y="213">Nguồn dữ liệu</text>
  <text class="small" x="110" y="240">Camera / Ảnh / Video</text>

  <rect class="box process" x="390" y="175" width="230" height="90"/>
  <text class="text" x="438" y="213">PyQt UI</text>
  <text class="small" x="420" y="240">CameraPanel, UploadPanel</text>

  <rect class="box process" x="710" y="175" width="230" height="90"/>
  <text class="text" x="770" y="213">YOLO Model</text>
  <text class="small" x="746" y="240">Detector.predict(frame)</text>

  <rect class="box decision" x="1030" y="175" width="260" height="90"/>
  <text class="text" x="1070" y="213">Violation Engine</text>
  <text class="small" x="1060" y="240">ROI + no_helmet matching</text>

  <path class="line" d="M300 220 H390"/>
  <path class="line" d="M620 220 H710"/>
  <path class="line" d="M940 220 H1030"/>

  <rect class="box ui" x="215" y="335" width="240" height="95"/>
  <text class="text" x="257" y="372">Hiển thị realtime</text>
  <text class="small" x="245" y="399">bbox, nhãn, ROI, status</text>

  <rect class="box alert" x="550" y="335" width="250" height="95"/>
  <text class="text" x="600" y="372">Cảnh báo vi phạm</text>
  <text class="small" x="587" y="399">không đội mũ bảo hộ</text>

  <rect class="box store" x="895" y="335" width="250" height="95"/>
  <text class="text" x="953" y="372">Lưu sự kiện</text>
  <text class="small" x="923" y="399">SQLite + ảnh raw/annotated</text>

  <rect class="box ui" x="1240" y="335" width="210" height="95"/>
  <text class="text" x="1284" y="372">Lịch sử</text>
  <text class="small" x="1268" y="399">Filter, CSV, xóa</text>

  <path class="line" d="M1160 265 V302 C1160 322 1030 315 1030 335"/>
  <path class="line" d="M1030 265 V300 C1030 318 705 318 705 335"/>
  <path class="line" d="M705 430 C705 465 1020 465 1020 430"/>
  <path class="line" d="M1145 382 H1240"/>
  <path class="dash" d="M825 265 V300 C825 318 350 318 350 335"/>

  <text class="section" x="80" y="535">Flowchart xử lý frame</text>

  <rect class="box input" x="585" y="570" width="330" height="76"/>
  <text class="text" x="645" y="600">Bắt đầu nhận dữ liệu</text>
  <text class="small" x="630" y="625">Camera frame hoặc ảnh/video upload</text>

  <rect class="box process" x="585" y="690" width="330" height="76"/>
  <text class="text" x="646" y="721">Tiền xử lý hiển thị</text>
  <text class="small" x="618" y="746">Webcam flip ngang, giữ frame hiện tại</text>

  <rect class="box process" x="585" y="810" width="330" height="76"/>
  <text class="text" x="632" y="841">YOLO xử lý frame</text>
  <text class="small" x="628" y="866">person, helmet, no_helmet, confidence</text>

  <polygon class="box decision" points="750,925 940,1005 750,1085 560,1005"/>
  <text class="text" x="635" y="997">Có người không đội mũ</text>
  <text class="small" x="668" y="1022">và nằm trong ROI?</text>

  <rect class="box ui" x="80" y="930" width="300" height="76"/>
  <text class="text" x="150" y="961">Không vi phạm</text>
  <text class="small" x="118" y="986">Chỉ hiển thị frame + số lượng 0</text>

  <rect class="box alert" x="1120" y="930" width="300" height="76"/>
  <text class="text" x="1195" y="961">Có vi phạm</text>
  <text class="small" x="1158" y="986">Hiển thị cảnh báo và số lượng</text>

  <rect class="box store" x="1120" y="810" width="300" height="76"/>
  <text class="text" x="1195" y="841">Tạo event</text>
  <text class="small" x="1148" y="866">Lưu DB, ảnh raw, ảnh annotated</text>

  <rect class="box store" x="1120" y="690" width="300" height="76"/>
  <text class="text" x="1178" y="721">Gửi Telegram</text>
  <text class="small" x="1148" y="746">Nếu cấu hình bot/chat hợp lệ</text>

  <rect class="box ui" x="1120" y="570" width="300" height="76"/>
  <text class="text" x="1180" y="600">Violation History</text>
  <text class="small" x="1158" y="625">Xem lại, lọc, xuất CSV, xóa</text>

  <path class="line" d="M750 646 V690"/>
  <path class="line" d="M750 766 V810"/>
  <path class="line" d="M750 886 V925"/>
  <path class="line" d="M560 1005 H380"/>
  <text class="label" x="465" y="990">Không</text>
  <path class="line" d="M940 1005 H1120"/>
  <text class="label" x="1015" y="990">Có</text>
  <path class="line" d="M1270 930 V886"/>
  <path class="line" d="M1270 810 V766"/>
  <path class="line" d="M1270 690 V646"/>

  <rect class="box process" x="80" y="690" width="300" height="120"/>
  <text class="text" x="132" y="724">ROI Config</text>
  <text class="small" x="108" y="752">Realtime: ROI lưu theo camera</text>
  <text class="small" x="108" y="776">Upload: ROI chọn trực tiếp</text>
  <path class="dash" d="M380 750 H585"/>

  <rect class="box process" x="80" y="830" width="300" height="70"/>
  <text class="text" x="127" y="861">Điều kiện event</text>
  <text class="small" x="112" y="886">confirmation_frames + cooldown</text>
  <path class="dash" d="M380 865 C465 865 485 1005 560 1005"/>
</svg>
